[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for pipelines
    step: Tests for step library modules
    xslt: Tests involving XSLT transformations
    python_step: Tests for Python-based steps
    slow: Tests that take more than 1 second
    requires_saxon: Tests that require Saxon-HE processor
    requires_fixtures: Tests that depend on external fixture files

# Minimum Python version
minversion = 3.8
